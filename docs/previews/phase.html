<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Buddy · Phase</title>
<style>
:root {
  color-scheme:dark; --bg:#101011; --panel:#19191a; --inset:#141415; --line:#343436;
  --ink:#f2eee7; --muted:#aaa8a5; --orange:#ff681e; --accent-ink:#17100c;
  --sans:Inter,"Segoe UI",Arial,sans-serif; --display:"Zalando Sans Expanded","Arial Black",Inter,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  font:16px/1.4 var(--sans); font-synthesis:weight;
}
* { box-sizing:border-box }
body { margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink) }
button,input { font:inherit; color:inherit }
button,a { -webkit-tap-highlight-color:transparent }
button { border:0; padding:0; background:none; cursor:pointer }
button:disabled { cursor:default; opacity:.42 }
a { color:inherit; text-decoration:none }
[hidden] { display:none!important }
:focus-visible { outline:2px solid var(--orange); outline-offset:4px }
h1,h2,h3,p { margin:0 }
h1,h2,h3 { line-height:1.1 }
h1 { font-family:var(--display); font-size:clamp(38px,4.2vw,62px); font-weight:820; letter-spacing:-.065em }
h2 { font-size:21px; font-weight:660; letter-spacing:-.035em }
h3 { font-size:16px; font-weight:650; letter-spacing:-.02em }
.mono,.count,.meta,kbd { font-family:var(--mono); font-variant-numeric:tabular-nums }
.muted,.meta { color:var(--muted) }
.meta { font-size:12px; line-height:1.65 }
.icon { width:1.12em; height:1.12em; display:inline-block; vertical-align:middle; flex:none; color:inherit }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
.wrap { width:min(1160px,calc(100% - 88px)); margin-inline:auto }
header { background:#131314; border-bottom:1px solid #303032 }
.top { height:74px; display:flex; gap:24px; align-items:center }
.brand { display:inline-flex; align-items:center; gap:12px; flex:none }
.floppy { width:37px; height:37px; display:block; flex:none }
.wordmark { display:block; width:126px; height:33px; }
.header-trace { height:30px; width:clamp(120px,28vw,420px); color:var(--orange); opacity:.90; margin-left:18px; }
.top-spacer { flex:1 }
.device { display:flex; align-items:center; gap:10px; font-size:13px; white-space:nowrap }
.device .icon { font-size:17px }
.dot { width:6px;height:6px; background:var(--orange); border-radius:50%; box-shadow:0 0 8px #ff681e50; display:inline-block; flex:none }
.device .connected { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:8px }
.divider { height:15px; width:1px; background:var(--line); margin:0 5px }
main { flex:1; padding:clamp(26px,4.6vh,54px) 0 32px }
.title-line { display:flex; align-items:center; gap:20px; justify-content:space-between }
.search { display:flex; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line); padding:0 12px; height:43px; width:245px; border-radius:6px; color:var(--muted) }
.search:focus-within { border-color:var(--orange) }
.search input { min-width:0; width:100%; background:none; border:0; outline:0; font-size:14px; color:var(--ink) }
.search input::placeholder { color:#aaa7a3 }
kbd { font-size:12px; line-height:1; border:1px solid #48484a; border-radius:3px; padding:3px 5px; color:#c5c1bb }
.filters { display:flex; gap:24px; align-items:center; border-bottom:1px solid var(--line); margin:19px 0 21px; overflow-x:auto }
.filter { display:flex; align-items:center; gap:7px; position:relative; min-height:43px; white-space:nowrap; font-size:14px; color:var(--muted) }
.filter[aria-pressed=true] { color:var(--ink) }
.filter[aria-pressed=true]::after { content:"";position:absolute; inset:auto 0 0; height:2px;background:var(--orange) }
.count { font-size:11px; color:#b3afaa; padding:0 5px; border:1px solid var(--line); border-radius:4px; line-height:16px }
.filter[aria-pressed=true] .count { color:var(--orange); border-color:#714025 }
.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px }
.card,.banner,.cinema { position:relative; overflow:hidden; isolation:isolate; background:#1d1c1a }
.card { text-align:left; border:1px solid #393735; display:flex; align-items:flex-end; padding:21px 24px; height:clamp(151px,22vh,209px); border-radius:8px }
.card:hover,.card:focus-visible { border-color:#bc632f }
.scene { position:absolute; inset:0; overflow:hidden; z-index:-2; pointer-events:none; background:#1c1916 }
.scene canvas { width:100%; height:100%; display:block; image-rendering:pixelated }
.card::before,.banner::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,#101011dd 0%,#10101161 51%,transparent 88%),linear-gradient(0deg,#101011c4,transparent 65%) }
.card-title { display:block; line-height:1.1; font-size:clamp(23px,2.15vw,31px); font-weight:750; letter-spacing:-.055em; margin-bottom:8px }
.card-status { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink) }
.card-status .icon { color:var(--orange); width:14px; height:14px }
.card-go { position:absolute; top:15px;right:15px; width:27px;height:27px; display:grid; place-items:center; border:1px solid #ffffff2b; background:#0c0c0c66; color:var(--ink); border-radius:50% }
.card:hover .card-go { background:var(--orange); border-color:var(--orange); color:var(--accent-ink) }
.empty { color:var(--muted); text-align:center; padding:40px 16px; grid-column:1/-1; }
.crumb { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; margin-bottom:15px }
.crumb:hover { color:var(--ink) }
.banner { border:1px solid var(--line); border-radius:8px; padding:19px 25px; margin-bottom:15px; min-height:87px; display:flex; align-items:center }
.banner::before { background:linear-gradient(90deg,#171717 10%,#161616aa 47%,#1717170a 88%) }
.banner h1 { font-size:clamp(33px,3.4vw,49px) }
.tools,.actions,.file-shortcuts,.hgroup { display:flex; align-items:center; gap:10px }
.tools,.actions { justify-content:space-between }
.actions { margin-top:18px; flex-wrap:wrap }
.btn { min-height:39px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 14px; background:#242425; border:1px solid #414143; border-radius:5px; font-size:14px; font-weight:600; white-space:nowrap }
.btn:hover:enabled { border-color:#8a8079 }
.primary { background:var(--orange); border-color:var(--orange); color:var(--accent-ink) }
.primary:hover:enabled { background:#ff7b39; border-color:#ff7b39 }
.flat { background:transparent }
.file-layout { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:16px; margin-top:14px }
.panel { border:1px solid var(--line); border-radius:7px; background:var(--panel); overflow:hidden; min-width:0 }
.panel-head { padding:16px 19px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:9px }
.panel-head h2 { font-size:16px }
.file-row { display:flex; align-items:center; gap:11px; padding:12px 17px; border-bottom:1px solid #ffffff0c; cursor:pointer; min-height:53px }
.file-row:last-child { border-bottom:0 }
.file-row:hover { background:#ffffff04 }
.file-row input,.pick-choice { accent-color:var(--orange); height:16px; width:16px; margin:0; flex:none }
.file-icon,.tree-list .icon { color:#b8b3ac }
.file-row>span:nth-last-child(2) { min-width:0; overflow-wrap:anywhere }
.file-size { margin-left:auto; white-space:nowrap; padding-left:5px }
.tree-list { list-style:none; padding:8px 19px 11px; margin:0; max-height:216px; overflow:auto; scrollbar-color:#585555 transparent }
.tree-list li { display:flex; align-items:center; gap:9px; color:#d8d4ce; font:13px/1.55 var(--mono); padding:4px 0; overflow-wrap:anywhere }
.tree-list li.child { padding-left:21px; color:#aca9a4 }
.tree-list li.child::before { content:""; border-left:1px solid #454344; border-bottom:1px solid #454344; width:7px; height:8px; flex:none; margin-right:0 }
.visual-note { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted) }
.visual-note .icon { color:var(--orange) }
.file-summary { font-size:13px; font-family:var(--mono); color:var(--muted) }
.conflict { max-width:850px; margin:0 auto }
.game-context { display:flex; align-items:center; gap:8px; font-size:14px; color:#c6c0b9; margin-bottom:10px }
.game-context .icon { color:var(--orange) }
.conflict h1 { font-size:clamp(37px,5vw,59px) }
.comparison { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:24px 0 17px; }
.version { position:relative; align-items:stretch; display:flex; flex-direction:column; gap:13px; padding:22px; color:var(--ink); border:1px solid var(--line); border-radius:7px; background:var(--panel); cursor:pointer }
.version:hover { border-color:#80634e }
.version:has(input:checked) { border-color:var(--orange); box-shadow:inset 0 0 0 1px var(--orange); background:#231c18 }
.version:focus-within { outline:2px solid var(--orange); outline-offset:3px }
.version input { position:absolute; opacity:0 }
.version-top,.version-bottom { display:flex; justify-content:space-between; align-items:center; gap:8px }
.version-top { color:var(--muted); font-size:13px }
.radio-mark { border:1px solid #797676; width:17px;height:17px;border-radius:50%;display:grid; place-items:center }
.version input:checked~.version-top .radio-mark { border-color:var(--orange) }
.version input:checked~.version-top .radio-mark::after { content:""; width:9px;height:9px;background:var(--orange);border-radius:50% }
.device-glyph { font-size:45px; color:var(--ink); height:52px; align-self:flex-start }
.version strong { font-size:26px; letter-spacing:-.045em; font-weight:700 }
.version-bottom { color:var(--muted); font:12px/1.55 var(--mono); flex-wrap:wrap; border-top:1px solid var(--line); padding-top:12px }
.conflict .actions { justify-content:flex-end; margin-top:24px }
.resolved { margin-top:24px; display:grid; gap:12px; justify-items:start; padding:28px }
.resolved>.icon { font-size:35px; color:var(--orange) }
.cinema { width:100%; min-height:clamp(375px,56vh,565px); display:grid; place-items:center; border-radius:9px; border:1px solid var(--line); padding:30px 18px }
.cinema::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(0deg,#101011d6,#11111173 70%),#11111126 }
.transfer { width:min(100%,485px); border:1px solid #5c4a40; background:#161616f7; box-shadow:0 18px 70px #05050599; border-radius:8px; padding:25px 26px 21px }
.transfer h1 { font-size:clamp(29px,3.5vw,40px); letter-spacing:-.055em }
.transfer-top { display:flex; align-items:center; justify-content:space-between; gap:10px }
.transfer .floppy { width:30px; height:30px }
.transfer .game-context { margin-bottom:5px }
.endpoints { display:flex; justify-content:space-between; gap:14px; color:#c9c4bf; font-size:13px; margin-top:30px }
.endpoints span { display:inline-flex; align-items:center; gap:7px }
.progress-track { width:100%; height:45px; margin:5px 0; color:var(--orange); display:block }
.transfer-foot { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font:13px var(--mono) }
.transfer-foot strong { font:700 22px var(--sans); color:var(--ink); letter-spacing:-.04em }
.transfer-controls { margin-top:20px; border-top:1px solid var(--line); padding-top:14px; display:flex; justify-content:flex-end }
.preview-bar { position:sticky; z-index:5; bottom:0; border-top:1px solid #353435; background:#101011f7; }
.preview-inner { min-height:65px; display:flex; gap:20px; align-items:center; justify-content:center }
.preview-label { font:11px var(--mono); color:#a8a39f }
.preview-links { display:flex; gap:3px; align-items:center; padding:3px; border:1px solid #39383a; border-radius:7px; background:#181819 }
.preview-links a { display:flex; align-items:center; gap:7px; font-size:13px; color:#a9a5a2; border:1px solid transparent; border-radius:4px; padding:7px 12px }
.preview-links a:hover { color:var(--ink) }
.preview-links a[aria-current=page] { color:var(--ink); background:#2b2522; border-color:#5c4133 }
.preview-links a[aria-current=page] .icon { color:var(--orange) }
dialog { width:min(470px,calc(100% - 28px)); max-height:90dvh; background:var(--panel); color:var(--ink); border:1px solid #5c524b; border-radius:8px; padding:20px; box-shadow:0 20px 90px #0009 }
dialog::backdrop { background:#080808c4 }
dialog h2 { font-size:23px }
dialog .tools { margin-bottom:17px }
.iconbtn { width:32px; height:32px; display:grid; place-items:center; border-radius:4px; color:var(--muted) }
.iconbtn:hover { background:#333; color:var(--ink) }
.file-shortcuts { gap:5px; flex-wrap:wrap; margin-bottom:12px }
.file-shortcuts button { border:1px solid var(--line); padding:6px 9px; border-radius:4px; color:var(--muted); font-size:13px }
.file-shortcuts button[aria-pressed=true] { color:var(--ink); border-color:#ad582e }
.picker-list { border-top:1px solid var(--line); min-height:100px; margin-top:7px }
#toast { position:fixed; z-index:6; left:50%; bottom:82px; transform:translateX(-50%); padding:10px 17px; border:1px solid #665246; border-radius:5px; background:#242222; box-shadow:0 6px 22px #0006; font-size:14px; white-space:nowrap }
#toast:empty { display:none }
@media(max-width:800px){
  .wrap{width:calc(100% - 48px)}.top{height:61px}.header-trace{margin-left:0;width:20vw}
  .file-layout{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:11px}.card{padding:18px}
  .panel-head{padding:13px}.file-row{padding:10px 12px}.file-row .meta{font-size:11px}
}
@media(max-width:600px){
  .wrap{width:calc(100% - 32px)} .header-trace{display:none}.top{gap:12px}.wordmark{width:105px;height:28px}
  .brand{gap:9px}.floppy{width:30px;height:30px}.device .connected,.device .divider{display:none}
  main{padding:23px 0}.title-line{align-items:flex-start;flex-direction:column;gap:15px}.search{width:100%;height:39px}
  .filters{gap:15px;margin:8px 0 13px}.filter{font-size:12px;gap:4px}.cards{grid-template-columns:1fr;gap:10px}
  .card{height:135px}.card-title{font-size:24px;margin-bottom:4px}.card-go{width:24px;height:24px;top:10px;right:10px}
  .file-layout{grid-template-columns:1fr}.file-summary{font-size:12px}.tree-list{max-height:155px}
  .comparison{gap:8px;margin:19px 0 13px}.version{padding:13px;gap:10px}.version strong{font-size:22px}
  .version-bottom{display:grid;gap:1px;font-size:11px}.device-glyph{font-size:34px;height:39px}
  .preview-inner{gap:0;min-height:58px}.preview-label{display:none}.preview-links{justify-content:space-around;flex:1}
  .preview-links a{padding:6px 5px;gap:4px;font-size:12px}.preview-links a .icon{width:14px;height:14px}
  .cinema{padding:13px;min-height:400px}.transfer{padding:18px}.file-shortcuts{gap:4px}
}
@media(max-height:650px) and (min-width:601px){
  .top{height:53px}main{padding:18px 0}.filters{margin:7px 0 12px}.card{height:126px}.preview-inner{min-height:50px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

  const bend=25+((seed>>>8)%38),rise=(seed&1)?-11:11;
  for(let i=0;i<3;i++){
    const y=68+i*5;ctx.beginPath();ctx.moveTo(9,y);ctx.lineTo(bend,y);
    ctx.lineTo(bend+15,y+rise);ctx.lineTo(91,y+rise);ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle="#171717";ctx.fillRect(4,88,4,5);ctx.fillRect(92,88,4,5);
  ctx.restore();
}
const previewCovers=new URLSearchParams(location.search).get("art");
function paintScene(canvas) {
  const s=surface(canvas);if(!s)return;
  const {ctx,w,h}=s, game=games.find(g=>g.id===canvas.dataset.art);
  const idx=game.art;
  if(!atlas.naturalWidth || idx==null || previewCovers==="off" || (previewCovers==="mixed" && idx%2===1)){
    drawDiskLabel(ctx,w,h,game.id);return;
  }
  const sw=atlas.naturalWidth/2, sh=atlas.naturalHeight/2;
  const scale=Math.max(w/sw,h/sh), cw=w/scale, ch=h/scale;
  const sx=(idx%2)*sw+(sw-cw)*.6, sy=Math.floor(idx/2)*sh+(sh-ch)*.49;
  ctx.imageSmoothingEnabled=true;ctx.drawImage(atlas,sx,sy,cw,ch,0,0,w,h);
}
function draw() {
  document.querySelectorAll("[data-icon]").forEach(el=>{
    const cv=document.createElement("canvas");cv.className="icon "+el.className;cv.dataset.glyph=el.dataset.icon;
    cv.setAttribute("aria-hidden","true");el.replaceWith(cv);
  });
  document.querySelectorAll(".icon").forEach(paintIcon);
  document.querySelectorAll(".floppy").forEach(paintFloppy);
  paintWordmark($(".wordmark"));
  document.querySelectorAll("[data-art]").forEach(paintScene);
  traces($(".header-trace"),1,true);
  const prog=$(".progress-track");if(prog)traces(prog,transfer.percent/100);
}
function scene(id) { return '<div class="scene" aria-hidden="true"><canvas data-art="'+id+'"></canvas></div>'; }
function files(name,kb,children,options={}) { return {name,kb,children,...options}; }
const games=[
  {id:"terraria",title:"Terraria",configured:true,shared:true,art:0,files:[
    files("Players",880,["Nova.plr","Nova.plr.bak"]),files("Worlds",32700,["Daybreak.wld","Daybreak.wld.bak"]),files("config.json",6)],
    extras:{"Home":[files("input profiles.json",4)],"Steam folder":[files("resourcepacks",1250,["Amber.zip"])]}},
  {id:"starbound",title:"Starbound",configured:false,shared:true,art:1,files:[
    files("player",760,["captain.player","captain.shipworld"]),files("universe",42500,["universe.dat","outpost.world"]),files("starbound.config",12)],
    extras:{"Home":[files("mod-notes.txt",2)],"Steam folder":[files("mods",3210,["local.pak"])]}},
  {id:"noita",title:"Noita",configured:true,shared:false,art:2,files:[
    files("save00",15300,["player.xml","world_state.xml"]),files("save_shared",440,["orbs.xml","flags.xml"]),files("config.xml",8)],
    extras:{"Home":[files("bindings.txt",2)],"Steam folder":[files("mods",335,["init.lua"])],"Proton prefix":[files("screenshots",1310,["cavern.png"])]}},
  {id:"stardew",title:"Stardew Valley",configured:false,shared:false,art:3,files:[
    files("Saves",8200,["Juniper_1234","SaveGameInfo"]),files("save-backups",16200,["Juniper.zip"]),files("startup_preferences",4)],
    extras:{"Home":[files("Screenshots",1850,["Farm.png"])],"Steam folder":[files("Mods",4530,["manifest.json"])]}}
];
let game=games[0], route="", query="", filter="All games", draft=new Set(), added=[], rootName="", picked=new Set();
const saved=new Map(games.map(g=>[g.id,g.configured?g.files.slice(0,2).map(f=>f.name):[]]));
const extraFiles=new Map(games.map(g=>[g.id,[]]));
let choice="", winner="", toastTimeout;
const transfer={percent:0,mode:"idle",started:0,frame:0};
const roles={"All games":()=>true,"Configured":g=>g.configured,"Shared recipes":g=>g.shared};
function size(kb){return kb>=1000 ? (kb/1000).toFixed(1)+" MB" : kb+" KB";}
function status(g){return g.configured?["check","Configured"]:g.shared?["share","Shared recipe"]:["install","Installed"];}
function toast(message){const el=$("#toast");el.textContent=message;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.textContent="",2200);}
function selectGame(g) {
  game=g; added=[...extraFiles.get(g.id)];
  draft=new Set(g.configured?saved.get(g.id):g.shared?g.files.slice(0,2).map(f=>f.name):[]);
}
function listFiles(){return [...game.files,...added];}
function card(g){
  const [glyph,label]=status(g);
  return '<button class="card" data-game="'+g.id+'">'+scene(g.id)+'<span class="card-go">'+mark("arrow")+'</span><span><span class="card-title">'+g.title+'</span><span class="card-status">'+mark(glyph)+label+'</span></span></button>';
}
function library(){
  main.innerHTML='<div class="title-line"><h1>Game library</h1><label class="search">'+mark("search")+
    '<span class="sr">Find a game</span><input type="search" id="search" placeholder="Find a game" autocomplete="off"><kbd aria-hidden="true">/</kbd></label></div>'+
    '<div class="filters" aria-label="Filter games"></div><div class="cards"></div>';
  $("#search").value=query;$("#search").addEventListener("input",e=>{query=e.target.value;libraryCards()});libraryCards();
}
function libraryCards(){
  $(".filters").innerHTML=Object.entries(roles).map(([name,test])=>'<button class="filter" data-filter="'+name+'" aria-pressed="'+(filter===name)+'">'+name+'<span class="count">'+games.filter(test).length+'</span></button>').join("");
  const matches=games.filter(g=>roles[filter](g)&&g.title.toLowerCase().includes(query.trim().toLowerCase()));
  $(".cards").innerHTML=matches.map(card).join("")||'<div class="empty">No matching games</div>';
  draw();
}
function row(f,checked,attr){
  return '<label class="file-row"><input type="checkbox" '+attr+'="'+f.name+'" '+(checked?"checked":"")+'><span class="file-icon">'+mark(f.children?"folder":"file")+'</span><span>'+f.name+'</span><span class="meta file-size">'+size(f.kb)+'</span></label>';
}
function filesView(){
  main.innerHTML='<a class="crumb" href="#library">'+mark("back")+'Game library</a><div class="banner">'+scene(game.id)+'<h1>'+game.title+'</h1></div>'+
    '<div class="tools"><h2>Files to sync</h2><button class="btn flat" data-action="browse">'+mark("plus")+'Add files</button></div>'+
    '<div class="file-layout"><section class="panel" aria-label="Available files"><div class="panel-head"><h2>Locations</h2></div><div id="file-rows">'+listFiles().map(f=>row(f,draft.has(f.name),"data-file")).join("")+'</div></section>'+
    '<section class="panel" aria-labelledby="included"><div class="panel-head"><h2 id="included">Included files</h2></div><ul class="tree-list"></ul></section></div>'+
    '<div class="actions"><output class="file-summary"></output><button class="btn primary" data-action="save">'+mark("check")+'Save selection</button></div>';
  updateFileSummary();draw();
}
function updateFileSummary(){
  const selected=listFiles().filter(f=>draft.has(f.name));
  const count=selected.reduce((n,f)=>n+(f.children?.length||1),0);
  $(".file-summary").textContent=count+" "+(count===1?"file":"files")+" · "+size(selected.reduce((n,f)=>n+f.kb,0));
  $(".tree-list").innerHTML=selected.map(f=>'<li>'+mark(f.children?"folder":"file")+f.name+'</li>'+
    (f.children||[]).map(name=>'<li class="child">'+name+'</li>').join("")).join("")||'<li>No files selected</li>';
  $('[data-action="save"]').disabled=!selected.length;draw();
}
function openPicker(){
  rootName=Object.keys(game.extras)[0];picked=new Set();pickerBody();picker.showModal();draw();
}
function pickerBody(){
  const roots=Object.keys(game.extras);
  picker.innerHTML='<div class="tools"><h2 id="picker-title">Add files</h2><button class="iconbtn" aria-label="Close file picker" data-action="close">'+mark("close")+'</button></div>'+
    '<div class="file-shortcuts">'+roots.map(r=>'<button data-root="'+r+'" aria-pressed="'+(r===rootName)+'">'+r+'</button>').join("")+'</div>'+
    '<div class="picker-list">'+game.extras[rootName].filter(f=>!listFiles().some(existing=>existing.name===f.name)).map(f=>row(f,picked.has(f.name),"data-pick")).join("")+'</div>'+
    '<div class="actions"><span class="file-summary" id="picked-count"></span><button class="btn primary" data-action="add">Add selection</button></div>';
  if(!$(".picker-list",picker).children.length)$(".picker-list",picker).innerHTML='<p class="empty">Already added</p>';
  pickerSummary();draw();
}
function pickerSummary(){$("#picked-count").textContent=picked.size+" selected";$('[data-action="add"]').disabled=!picked.size;}
const versions=[
  {id:"local",side:"This device",name:"Desktop",icon:"desktop",when:"Nov 24 · 18:42",size:"33.6 MB",files:"4 files"},
  {id:"server",side:"Server copy",name:"Steam Deck",icon:"deck",when:"Nov 24 · 17:08",size:"32.8 MB",files:"4 files"}
];
function version(v){
  return '<label class="version"><input type="radio" name="version" value="'+v.id+'" '+(choice===v.id?"checked":"")+'>'+
    '<span class="version-top">'+v.side+'<span class="radio-mark" aria-hidden="true"></span></span><span class="device-glyph">'+mark(v.icon)+'</span><strong>'+v.name+'</strong>'+
    '<span class="meta">'+v.when+'</span><span class="version-bottom"><span>'+v.files+'</span><span>'+v.size+'</span></span></label>';
}
function conflictView(){
  const chosen=versions.find(v=>v.id===winner);
  const body=chosen?'<div class="panel resolved">'+mark("check")+'<h2>Using the '+chosen.name+' save</h2><p class="visual-note">'+mark("lock")+'Both backups are kept permanently.</p><button class="btn flat" data-action="compare">Compare again</button></div>':
    '<div class="comparison" role="radiogroup" aria-label="Save version">'+versions.map(version).join("")+'</div>'+
    '<div class="visual-note">'+mark("lock")+'Both versions have permanent backups.</div><div class="actions"><button class="btn flat" data-action="later">Decide later</button>'+
    '<button class="btn primary" data-action="resolve" '+(!choice?"disabled":"")+'>Use selected save</button></div>';
  main.innerHTML='<section class="conflict"><div class="game-context">'+mark("game")+'Terraria</div><h1>'+(chosen?"Conflict resolved":"Save conflict")+'</h1>'+body+'</section>';draw();
}
function transferView(){
  main.innerHTML='<section class="cinema" aria-label="Steam launch preview">'+scene("terraria")+'<div class="transfer">'+
    '<div class="transfer-top"><div><div class="game-context">Terraria</div><h1 id="transfer-title"></h1></div><canvas class="floppy" aria-hidden="true"></canvas></div>'+
    '<div class="endpoints"><span>'+mark("server")+'Server</span><span>'+mark("desktop")+'Desktop</span></div>'+
    '<canvas class="progress-track" aria-hidden="true"></canvas><div class="transfer-foot" role="progressbar" aria-label="Save transfer" aria-valuemin="0" aria-valuemax="100"><span id="bytes"></span><strong id="percent"></strong></div>'+
    '<div class="transfer-controls"><button class="btn flat" id="transfer-control"></button></div></div></section>';
  updateTransfer();draw();
}
function updateTransfer(){
  const done=transfer.mode==="done", cancelled=transfer.mode==="cancelled", verifying=transfer.percent>=96;
  const heading=done?"Ready to play":cancelled?"Sync cancelled":verifying?"Verifying save":"Syncing save";
  if($("#transfer-title").textContent!==heading)$("#transfer-title").textContent=heading;
  const n=Math.min(32.8,transfer.percent/96*32.8);
  $("#bytes").textContent=n.toFixed(1)+" / 32.8 MB";$("#percent").textContent=Math.floor(transfer.percent)+"%";
  $(".transfer-foot").setAttribute("aria-valuenow",String(Math.floor(transfer.percent)));
  const action=done||cancelled?"Replay transfer":"Cancel";
  const control=$("#transfer-control");if(control.textContent!==action)control.textContent=action;
  traces($(".progress-track"),transfer.percent/100);
}
function startTransfer(){
  cancelAnimationFrame(transfer.frame);transfer.percent=0;transfer.mode="running";transfer.started=performance.now();transferView();
  function tick(time){
    if(route!=="transfer"||transfer.mode!=="running")return;
    transfer.percent=Math.min(100,(time-transfer.started)/145);
    if(transfer.percent>=100)transfer.mode="done";
    updateTransfer();if(transfer.mode==="running")transfer.frame=requestAnimationFrame(tick);
  }
  transfer.frame=requestAnimationFrame(tick);
}
function navigate(initial=false){
  const next=location.hash.slice(1);route=["library","files","conflict","transfer"].includes(next)?next:"library";
  cancelAnimationFrame(transfer.frame);if(picker.open)picker.close();
  if(route==="library")library();
  if(route==="files")filesView();
  if(route==="conflict")conflictView();
  if(route==="transfer")startTransfer();
  document.querySelectorAll(".preview-links a").forEach(a=>{if(a.hash==="#"+route)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  draw();window.scrollTo(0,0);if(!initial)main.focus({preventScroll:true});
}
document.addEventListener("click",e=>{
  const button=e.target.closest("button");if(!button)return;
  if(button.dataset.game){selectGame(games.find(g=>g.id===button.dataset.game));location.hash="files";return;}
  if(button.dataset.filter){filter=button.dataset.filter;libraryCards();document.querySelector('[data-filter="'+filter+'"]').focus();return;}
  if(button.dataset.root){rootName=button.dataset.root;pickerBody();document.querySelector('[data-root="'+rootName+'"]').focus();return;}
  switch(button.dataset.action){
    case "browse": openPicker();break;
    case "close": picker.close();break;
    case "add":
      for(const f of Object.values(game.extras).flat())if(picked.has(f.name)){added.push(f);draft.add(f.name);}
      picker.close();filesView();$('[data-action="browse"]').focus();break;
    case "save":
      saved.set(game.id,[...draft]);extraFiles.set(game.id,[...added]);game.configured=true;location.hash="library";toast("Saved "+game.title+" selection");break;
    case "later": choice="";location.hash="library";break;
    case "resolve": if(choice){winner=choice;conflictView();$('[data-action="compare"]').focus();}break;
    case "compare": choice="";winner="";conflictView();$('input[name="version"]').focus();break;
  }
  if(button.id==="transfer-control"){
    if(transfer.mode==="running"){cancelAnimationFrame(transfer.frame);transfer.mode="cancelled";updateTransfer();}
    else {startTransfer();$("#transfer-control").focus();}
  }
});
document.addEventListener("change",e=>{
  const input=e.target;
  if(input.dataset.file){if(input.checked)draft.add(input.dataset.file);else draft.delete(input.dataset.file);updateFileSummary();}
  if(input.dataset.pick){if(input.checked)picked.add(input.dataset.pick);else picked.delete(input.dataset.pick);pickerSummary();}
  if(input.name==="version"){choice=input.value;$('[data-action="resolve"]').disabled=false;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="/" && route==="library" && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.matches("input,textarea")){e.preventDefault();$("#search").focus();}
});
picker.addEventListener("click",e=>{if(e.target===picker){const b=picker.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)picker.close();}});
window.addEventListener("hashchange",()=>navigate());
window.addEventListener("resize",draw);
atlas.addEventListener("load",draw);
atlas.addEventListener("error",draw);
selectGame(game);navigate(true);
</script>
</body>
</html>
