[tools]
rust = "stable"

[vars]
# The Steam Deck launch probe reads Linux process and cgroup state.
workspace = "--workspace{% if os() != 'linux' %} --exclude buddy-probe{% endif %}"

[tasks.check]
description = "Run formatting checks, Clippy, and the workspace tests"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked {{vars.workspace}} --all-targets -- -D warnings",
  "cargo test --locked {{vars.workspace}}",
]

[tasks."test:sync"]
description = "Exercise two-device sync against a disposable Linux server (requires Python 3)"
run = [
  "cargo build --locked --release -p buddy",
  'python3 tests/sync.py "${CARGO_TARGET_DIR:-target}/release/buddy"',
  'python3 tests/workflows.py "${CARGO_TARGET_DIR:-target}/release/buddy"',
]

[tasks."build:linux"]
description = "Build portable x86-64 Buddy for Linux desktops and Steam Deck (glibc 2.28)"
tools = { zig = "0.14.1", "cargo:cargo-zigbuild" = "0.24.1" }
run = [
  "rustup target add x86_64-unknown-linux-gnu",
  "cargo zigbuild --locked --release -p buddy --target x86_64-unknown-linux-gnu.2.28",
]

[tasks.stage]
description = "Build the x86-64 Linux host and both clients into server-stage/"
tools = { zig = "0.14.1", "cargo:cargo-zigbuild" = "0.24.1" }
run = '''
set -eu
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}"
linux=x86_64-unknown-linux-gnu
windows=x86_64-pc-windows-gnullvm

mise run build:linux
rustup target add "$windows"
cargo zigbuild --locked --release -p buddy --target "$windows"
# Cargo uses the same output path for both Linux glibc targets.
cargo zigbuild --locked --release -p buddy --target "$linux" --target-dir "$CARGO_TARGET_DIR/stage-host"

mkdir -p server-stage
install -m 755 "$CARGO_TARGET_DIR/stage-host/$linux/release/buddy" server-stage/buddy
install -m 755 "$CARGO_TARGET_DIR/$linux/release/buddy" server-stage/buddy-linux-x86_64
install -m 755 "$CARGO_TARGET_DIR/$windows/release/buddy.exe" server-stage/buddy-windows-x86_64.exe
'''
