[tools]
rust = "stable"

[vars]
# The Steam Deck launch probe reads Linux process and cgroup state.
workspace = "--workspace{% if os() != 'linux' %} --exclude buddy-probe{% endif %}"

[tasks.check]
description = "Run formatting checks, Clippy, and the workspace tests"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked {{vars.workspace}} --all-targets -- -D warnings",
  "cargo test --locked {{vars.workspace}}",
]

[tasks."test:sync"]
description = "Exercise two-device sync against a disposable Linux server (requires Python 3)"
run = [
  "cargo build --locked --release -p buddy",
  'python3 tests/sync.py "${CARGO_TARGET_DIR:-target}/release/buddy"',
]

[tasks."build:linux"]
description = "Build portable x86-64 Buddy for Linux desktops and Steam Deck (glibc 2.28)"
tools = { zig = "0.14.1", "cargo:cargo-zigbuild" = "0.24.1" }
run = [
  "rustup target add x86_64-unknown-linux-gnu",
  "cargo zigbuild --locked --release -p buddy --target x86_64-unknown-linux-gnu.2.28",
]
