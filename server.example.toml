# Set listen to the local IP and port to serve. Plain HTTP on a non-loopback
# address prints a startup warning. Use [IPv6]:port for an IPv6 address.
listen = "127.0.0.1:7341"
database = "buddy-data/server.sqlite3"

# Publish a client build from this host with:
# buddy publish-release --config server.toml linux-x86_64 /path/to/portable/buddy
# buddy publish-release --config server.toml windows-x86_64 /path/to/buddy.exe
# Keep the .releases directory beside the database when moving or backing up the host.

# Optional physical chunk allowance per account, in bytes.
# account_quota_bytes = 107374182400

# For a manually managed HTTPS listener, set listen above to the desired IP:port
# and enable this section. Paths are relative to this settings file.
# [tls]
# certificate = "server-chain.pem"
# private_key = "server-key.pem"
